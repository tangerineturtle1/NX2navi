[[scene]]
name = "dekuboss"
note = "The Deku Tree's boss room, the free camera looking up at the ceiling (players reported the frame rate falls there)"
dbg = [["@1000", "warp GohmaStage GohmaStage"], ["@10000", "freecam 1 1 2"], ["@10000", "camavoid 1"]]
# RSTICK y raises the view 1.8 radians a second at full tilt: 1 s at half tilt looks about 50 degrees up, a turn on the
# spot, 0.6 s more to about 80 degrees, a turn back, then level again and the slow turn of the other scenes.
moves = [[0, "RSTICK", 0, 16384, 1.0],
         [1.5, "RSTICK", 16384, 0, 5.24],
         [7, "RSTICK", 0, 16384, 0.6],
         [8, "RSTICK", -16384, 0, 5.24],
         [14, "RSTICK", 0, -16384, 1.6],
         [16, "RSTICK", 8192, 0, 10.48]]
