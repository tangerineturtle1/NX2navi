# Benchmark scenes for tools/bench.py (docs/performance.md). Game 1.1.1, child Link.
#
# Per scene:
#   dbg        NX2NAVI_DBG_TEST steps as [when, step]; when "@<ms>" is game time since the save loaded
#              (runtime/debug_tools.c test_script): warp <area> <start position>, freecam <on> <sticks> <metres a
#              second>, camavoid <0|1> (keep the free camera a metre above the ground), event <name>
#   moves      stick lines on the input script, as [seconds after the warm-up, stick, x, y, seconds held]. With the
#              free camera on, LSTICK y flies it ahead and RSTICK x turns it (2.4 radians a second at full tilt)
#   warmup_s   game time before measuring: the teleport, the area load and the first textures and pipelines
#   measure_s  game time measured
# The areas and start positions are the ones the game's StartPos file names (NX2NAVI_DBG_TEST logs them as
# "debug: place").
#
# The flight, the same in every scene, at 2 m a second: a full turn on the spot, 8 m ahead, a full turn back, 8 m back,
# a slow full turn, 8 m ahead while turning a little and back. It stays within about 8 m of the start position, where
# the game's own camera put it behind Link, so it does not pass through walls into the void outside the map (wider
# arcs did), and it still sees the whole area from there.

[[scene]]
name = "kokiri"
note = "Kokiri Forest, the known worst case: the village from its middle"
dbg = [["@1000", "warp KokiriForest_Child ReturnFromDreamWorld"], ["@10000", "freecam 1 1 2"], ["@10000", "camavoid 1"]]
moves = [[0, "RSTICK", 16384, 0, 5.24],
         [6, "LSTICK", 0, 32767, 4],
         [10.5, "RSTICK", -16384, 0, 5.24],
         [16, "LSTICK", 0, -32767, 4],
         [20.5, "RSTICK", 8192, 0, 10.48],
         [31.5, "LSTICK", 0, 32767, 4], [31.5, "RSTICK", -6000, 0, 4],
         [36, "LSTICK", 0, -32767, 3.5]]
warmup_s = 14
measure_s = 40

