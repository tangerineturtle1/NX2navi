[[scene]]
name = "fieldrun"
note = "Hyrule Field at speed, from outside the Market gate: the free camera flies 8 m a second, about 130 m out over the open field and back, so new parts of the field come into view as when running across it"
dbg = [["@1000", "warp HyruleField_Child HyruleField_FrontOfMarket"], ["@10000", "freecam 1 1 8"], ["@10000", "camavoid 1"],
       ["@10500", "camgo 0 3 0 0 0.087"]]
# The game's camera starts 0.087 rad below level and ground avoidance needs DLSS, DLAA or FSR, so the camgo levels the
# view and lifts it 3 m: the legs fly level over the field instead of into it. 128 m out, a half turn, 128 m back and a
# half turn again, so the last frame looks out over the field as the first did.
moves = [[0, "LSTICK", 0, 32767, 16],
         [16.5, "RSTICK", 16384, 0, 2.62],
         [19.5, "LSTICK", 0, 32767, 13.5],
         [36, "RSTICK", 16384, 0, 2.62]]
warmup_s = 14
measure_s = 40
